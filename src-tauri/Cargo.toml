[package]
name = "redix"
version = "0.1.0"
description = "Redix Redis desktop client"
authors = ["Redix"]
edition = "2021"

[lib]
name = "redix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = { version = "4.1", default-features = false, features = ["v1"] }
redis = { version = "1.5", features = ["tokio-comp"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Storage_FileSystem"] }
