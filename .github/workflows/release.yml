name: 发布

on:
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: 发布预检
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 验证标签与各版本源一致
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { getConsistentVersion, VERSION_PATHS } from "./scripts/release-core.mjs";

          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? "")) {
            throw new Error(`发布标签必须为稳定 vX.Y.Z：${tag}`);
          }
          const contents = Object.fromEntries(
            Object.entries(VERSION_PATHS).map(([key, path]) => [key, readFileSync(path, "utf8")]),
          );
          const version = getConsistentVersion(contents);
          if (tag !== `v${version}`) {
            throw new Error(`标签 ${tag} 与项目版本 ${version} 不一致`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

  publish:
    name: 构建并发布 (${{ matrix.platform }} ${{ matrix.args }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rustTargets: ""
          - platform: windows-latest
            args: ""
            rustTargets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux Tauri 与 WebKitGTK 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-release-${{ matrix.platform }}-${{ matrix.args }}

      - name: 发布 Tauri 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: Redix v__VERSION__
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
