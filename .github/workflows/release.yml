name: 验证与发布

on:
  push:
    tags:
      - v*
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: 发布预检
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 验证标签与各版本源一致
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { getConsistentVersion, VERSION_PATHS } from "./scripts/release-core.mjs";

          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? "")) {
            throw new Error(`发布标签必须为稳定 vX.Y.Z：${tag}`);
          }
          const contents = Object.fromEntries(
            Object.entries(VERSION_PATHS).map(([key, path]) => [key, readFileSync(path, "utf8")]),
          );
          const version = getConsistentVersion(contents);
          if (tag !== `v${version}`) {
            throw new Error(`标签 ${tag} 与项目版本 ${version} 不一致`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Ubuntu 构建与 Redis 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev redis-server redis-tools

      - name: 安装 macOS Redis 依赖
        if: runner.os == 'macOS'
        run: brew install redis

      - run: npm ci
      - run: npm run test:release
      - run: npm run test:frontend
      - run: npm run test:rust
      - run: npm run build

      - name: 验证隔离 Cluster launcher 安全合同
        run: python -B -m unittest scripts/test_local_cluster_test.py -v

      - name: 运行本地 Redis 流程
        if: runner.os != 'Windows'
        run: npm run test:redis:local

      - name: 运行真实三主节点 Cluster 流程
        if: runner.os != 'Windows'
        run: npm run test:redis:cluster

      - name: 说明 Windows 集成边界
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Output 'Windows runner 未安装 redis-server/redis-cli，因此显式跳过本地 Redis 与 Cluster 网络集成；其余 Rust、前端、Web 和 native no-bundle 构建仍执行。'

      - run: npm run check:non-cloud
      - run: npm run tauri:build -- --no-bundle

  publish:
    name: 构建并发布 (${{ matrix.platform }} ${{ matrix.args }})
    if: github.event_name == 'push'
    needs: [preflight, verify]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rustTargets: ""
          - platform: windows-latest
            args: ""
            rustTargets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux Tauri 与 WebKitGTK 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-release-${{ matrix.platform }}-${{ matrix.args }}

      - name: 发布 Tauri 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: Redix v__VERSION__
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
